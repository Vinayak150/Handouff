name: HandoffGuard recovery reference checks
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  no-secrets-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run scenarios
      - run: npm run build
      - run: npm run audit:release
      - run: npm run docs:check
      - name: Check public asset manifest
        run: test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 10
